name: Proposta
description: Sugira uma melhoria ou um novo requisito do catálogo.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que situação real isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Para requisitos, inclua critérios de aceite, aplicabilidade e como seria verificado sem depender de um fornecedor específico.
    validations:
      required: true
